<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Nir Diamant. Open-source GenAI education: RAG, agents, prompting, production.">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0d1117"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow1)"/>
    <rect width="1200" height="300" fill="url(#glow2)"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="86" font-size="20" font-weight="600" letter-spacing="5" fill="url(#accent)">GENERATIVE AI  ·  RAG  ·  AGENTS  ·  PRODUCTION</text>
    <text x="600" y="156" font-size="64" font-weight="800" letter-spacing="-1" fill="#f0f6fc">Nir Diamant</text>
    <text x="600" y="200" font-size="24" font-weight="400" fill="#c9d1d9">Open-source GenAI education, written as code you can run</text>
    <g font-size="17" font-weight="600" fill="#e6edf3">
      <rect x="215" y="230" width="230" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="330" y="256">⭐ 85K+ GitHub stars</text>
      <rect x="465" y="230" width="270" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="600" y="256">👩‍💻 500K+ developers a month</text>
      <rect x="755" y="230" width="230" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="870" y="256">📚 3 books, 1 bestseller</text>
    </g>
  </g>
</svg>
